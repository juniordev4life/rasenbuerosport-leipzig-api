name: Match Day

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PROJECT_ID: rasenbuerosport-leipzig-9d54f
  REGION: europe-west3
  SERVICE_NAME: rasenbuerosport-api
  REPOSITORY: rasenbuerosport-api

jobs:
  checks:
    name: Pre-Match Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tactics Check (Lint)
        run: npm run lint:check

      - name: Formation Check (Format)
        run: npm run format:check

  deploy:
    name: Deploy to Cloud Run
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "NODE_ENV=production,PUSH_VAPID_PUBLIC_KEY=BBKrLzhuUUOHc56dcXBVwrGV-DCYu30QVdCb-my3Mg6upUR-QL7liHugKOOXGeRHcIuqNsM02V0_MZX6oltLpe0,PUSH_VAPID_SUBJECT=mailto:Marco.Slusalek@redbulls.com" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,CORS_ORIGIN=CORS_ORIGIN:latest,WRAPPED_TRIGGER_SECRET=WRAPPED_TRIGGER_SECRET:latest,PUSH_VAPID_PRIVATE_KEY=PUSH_VAPID_PRIVATE_KEY:latest,ELEVENLABS_API_KEY=ELEVENLABS_API_KEY:latest,ELEVENLABS_VOICE_ID=ELEVENLABS_VOICE_ID:latest,ELEVENLABS_VOICE_ID_KLASSIKER=ELEVENLABS_VOICE_ID_KLASSIKER:latest,ELEVENLABS_VOICE_ID_ANALYST=ELEVENLABS_VOICE_ID_ANALYST:latest,ELEVENLABS_VOICE_ID_EUPHORIKER=ELEVENLABS_VOICE_ID_EUPHORIKER:latest,ELEVENLABS_MODEL_ID=ELEVENLABS_MODEL_ID:latest,ELEVENLABS_KEEP_AUDIO_TAGS=ELEVENLABS_KEEP_AUDIO_TAGS:latest" \
            --add-cloudsql-instances "${{ secrets.CLOUD_SQL_CONNECTION_NAME }}" \
            --quiet
